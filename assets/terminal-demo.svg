<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#070a0e" />
    </linearGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes line-reveal-1 { 0%, 5% { opacity: 0; } 10%, 100% { opacity: 1; } }
      @keyframes line-reveal-2 { 0%, 15% { opacity: 0; } 22%, 100% { opacity: 1; } }
      @keyframes line-reveal-3 { 0%, 30% { opacity: 0; } 38%, 100% { opacity: 1; } }
      @keyframes line-reveal-4 { 0%, 48% { opacity: 0; } 55%, 100% { opacity: 1; } }
      @keyframes line-reveal-5 { 0%, 65% { opacity: 0; } 72%, 100% { opacity: 1; } }
      @keyframes line-reveal-6 { 0%, 80% { opacity: 0; } 88%, 100% { opacity: 1; } }

      .term-text {
        font-family: 'Consolas', 'Fira Code', 'Cascadia Code', monospace;
        font-size: 13.5px;
      }
      .cursor-blink { animation: blink 0.8s infinite; }
      .anim-l1 { animation: line-reveal-1 8s infinite; }
      .anim-l2 { animation: line-reveal-2 8s infinite; }
      .anim-l3 { animation: line-reveal-3 8s infinite; }
      .anim-l4 { animation: line-reveal-4 8s infinite; }
      .anim-l5 { animation: line-reveal-5 8s infinite; }
      .anim-l6 { animation: line-reveal-6 8s infinite; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="10" y="10" width="880" height="460" rx="10" fill="url(#term-bg)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Terminal Header -->
  <path d="M 10 20 Q 10 10 20 10 L 880 10 Q 890 10 890 20 L 890 48 L 10 48 Z" fill="url(#header-grad)" />
  <line x1="10" y1="48" x2="890" y2="48" stroke="#1e293b" stroke-width="1" />

  <!-- Mac / Linux Window Controls -->
  <circle cx="32" cy="29" r="6" fill="#ef4444" />
  <circle cx="52" cy="29" r="6" fill="#f59e0b" />
  <circle cx="72" cy="29" r="6" fill="#10b981" />

  <!-- Terminal Tab Title -->
  <text x="450" y="34" fill="#94a3b8" font-family="'Segoe UI', monospace" font-size="12" font-weight="600" text-anchor="middle">
    user@recon-station: ~/BlackBox [bash]
  </text>

  <!-- Terminal Body Content -->
  <g transform="translate(30, 80)" class="term-text">
    <!-- Prompt 1 -->
    <text x="0" y="0">
      <tspan fill="#00ff88" font-weight="bold">user@blackbox</tspan>
      <tspan fill="#64748b">:</tspan>
      <tspan fill="#38bdf8">~/recon</tspan>
      <tspan fill="#f8fafc">$ </tspan>
      <tspan fill="#f1f5f9" font-weight="bold">python main.py --target 192.168.1.0/24 --module network</tspan>
    </text>

    <!-- Output 1 -->
    <g class="anim-l1" transform="translate(0, 26)">
      <text x="0" y="0" fill="#00f2fe">[*] Initializing Network Discovery Module...</text>
      <text x="0" y="20" fill="#64748b">[+] Scanning 254 potential hosts across 192.168.1.0/24</text>
    </g>

    <!-- Table Output -->
    <g class="anim-l2" transform="translate(0, 72)">
      <text x="0" y="0" fill="#334155">┌───────────────────┬──────────────┬──────────────────────────────┬──────────┐</text>
      <text x="0" y="18" fill="#38bdf8"><tspan fill="#334155">│ </tspan>IP Address        <tspan fill="#334155">│ </tspan>Status       <tspan fill="#334155">│ </tspan>Hostname / Device Info         <tspan fill="#334155">│ </tspan>Latency  <tspan fill="#334155">│</tspan></text>
      <text x="0" y="36" fill="#334155">├───────────────────┼──────────────┼──────────────────────────────┼──────────┤</text>
      <text x="0" y="54"><tspan fill="#334155">│ </tspan><tspan fill="#f8fafc">192.168.1.1       </tspan><tspan fill="#334155">│ </tspan><tspan fill="#10b981">ONLINE       </tspan><tspan fill="#334155">│ </tspan><tspan fill="#cbd5e1">gateway.local (Router)         </tspan><tspan fill="#334155">│ </tspan><tspan fill="#a78bfa">&lt;1ms     </tspan><tspan fill="#334155">│</tspan></text>
      <text x="0" y="72"><tspan fill="#334155">│ </tspan><tspan fill="#f8fafc">192.168.1.15      </tspan><tspan fill="#334155">│ </tspan><tspan fill="#10b981">ONLINE       </tspan><tspan fill="#334155">│ </tspan><tspan fill="#cbd5e1">workstation-pc.lan             </tspan><tspan fill="#334155">│ </tspan><tspan fill="#a78bfa">2ms      </tspan><tspan fill="#334155">│</tspan></text>
      <text x="0" y="90"><tspan fill="#334155">│ </tspan><tspan fill="#f8fafc">192.168.1.42      </tspan><tspan fill="#334155">│ </tspan><tspan fill="#10b981">ONLINE       </tspan><tspan fill="#334155">│ </tspan><tspan fill="#cbd5e1">nas-storage.lan                </tspan><tspan fill="#334155">│ </tspan><tspan fill="#a78bfa">1ms      </tspan><tspan fill="#334155">│</tspan></text>
      <text x="0" y="108" fill="#334155">└───────────────────┴──────────────┴──────────────────────────────┴──────────┘</text>
      <text x="0" y="128" fill="#10b981">[✓] Discovered 3 active hosts out of 254 addresses.</text>
    </g>

    <!-- Prompt 2 (GUI Launch) -->
    <g class="anim-l4" transform="translate(0, 235)">
      <text x="0" y="0">
        <tspan fill="#00ff88" font-weight="bold">user@blackbox</tspan>
        <tspan fill="#64748b">:</tspan>
        <tspan fill="#38bdf8">~/recon</tspan>
        <tspan fill="#f8fafc">$ </tspan>
        <tspan fill="#f1f5f9" font-weight="bold">python main.py --gui</tspan>
      </text>
    </g>

    <!-- Output 2 -->
    <g class="anim-l5" transform="translate(0, 262)">
      <text x="0" y="0" fill="#a78bfa">[*] Launching Modern Desktop GUI...</text>
      <text x="0" y="20" fill="#00f2fe">[✓] Tkinter Dark Cyber Theme Engine initialized.</text>
      <text x="0" y="40" fill="#10b981">[✓] GUI Dashboard running on thread (1100x750 viewport).</text>
    </g>

    <!-- Active Prompt with blinking cursor -->
    <g class="anim-l6" transform="translate(0, 335)">
      <text x="0" y="0">
        <tspan fill="#00ff88" font-weight="bold">user@blackbox</tspan>
        <tspan fill="#64748b">:</tspan>
        <tspan fill="#38bdf8">~/recon</tspan>
        <tspan fill="#f8fafc">$ </tspan>
      </text>
      <rect class="cursor-blink" x="180" y="-12" width="8" height="15" fill="#00ff88" />
    </g>
  </g>
</svg>
