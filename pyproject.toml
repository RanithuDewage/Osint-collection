[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox"
version = "2.0.0"
description = "Advanced Reconnaissance & Security Assessment Framework with Modern GUI"
readme = "README.md"
requires-python = ">=3.10"

dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["main", "gui"]

[tool.setuptools.packages.find]
include = ["config*", "modules*", "utils*"]

[project.scripts]
blackbox = "main:main"
blackbox-gui = "gui:launch_gui"
